<?xml version="1.0" encoding="UTF-8"?>
<!-- =====================================================================
     LOGO OFFICIEL DE L'ASSOCIATION LEFONA (version vectorielle complète)
     Emblème : cornes de zébu, lance (« lefona »), écu orné d'un rameau,
     d'un tissage et d'une frise, encadré de deux rameaux d'olivier.
     Ce fichier peut être utilisé pour les documents, affiches, réseaux
     sociaux, etc. Il reste net à toutes les tailles.
     ===================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Logo de l'Association Lefona">
  <g fill="#35302a">

    <!-- ================= RAMEAU GAUCHE ================= -->
    <g>
      <path d="M52 200 C30 172 24 128 38 88" fill="none" stroke="#35302a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="36" cy="86" rx="3.4" ry="9" transform="rotate(-30 36 86)"/>
      <ellipse cx="31" cy="106" rx="3.4" ry="9" transform="rotate(-14 31 106)"/>
      <ellipse cx="29" cy="127" rx="3.4" ry="9" transform="rotate(-2 29 127)"/>
      <ellipse cx="31" cy="148" rx="3.4" ry="9" transform="rotate(10 31 148)"/>
      <ellipse cx="37" cy="168" rx="3.4" ry="9" transform="rotate(24 37 168)"/>
      <ellipse cx="46" cy="186" rx="3.4" ry="9" transform="rotate(38 46 186)"/>
      <ellipse cx="47" cy="92" rx="3.4" ry="9" transform="rotate(50 47 92)"/>
      <ellipse cx="42" cy="112" rx="3.4" ry="9" transform="rotate(64 42 112)"/>
      <ellipse cx="41" cy="133" rx="3.4" ry="9" transform="rotate(76 41 133)"/>
      <ellipse cx="43" cy="154" rx="3.4" ry="9" transform="rotate(88 43 154)"/>
      <ellipse cx="49" cy="174" rx="3.4" ry="9" transform="rotate(100 49 174)"/>
    </g>

    <!-- ================= RAMEAU DROIT (miroir) ================= -->
    <g transform="translate(240 0) scale(-1 1)">
      <path d="M52 200 C30 172 24 128 38 88" fill="none" stroke="#35302a" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="36" cy="86" rx="3.4" ry="9" transform="rotate(-30 36 86)"/>
      <ellipse cx="31" cy="106" rx="3.4" ry="9" transform="rotate(-14 31 106)"/>
      <ellipse cx="29" cy="127" rx="3.4" ry="9" transform="rotate(-2 29 127)"/>
      <ellipse cx="31" cy="148" rx="3.4" ry="9" transform="rotate(10 31 148)"/>
      <ellipse cx="37" cy="168" rx="3.4" ry="9" transform="rotate(24 37 168)"/>
      <ellipse cx="46" cy="186" rx="3.4" ry="9" transform="rotate(38 46 186)"/>
      <ellipse cx="47" cy="92" rx="3.4" ry="9" transform="rotate(50 47 92)"/>
      <ellipse cx="42" cy="112" rx="3.4" ry="9" transform="rotate(64 42 112)"/>
      <ellipse cx="41" cy="133" rx="3.4" ry="9" transform="rotate(76 41 133)"/>
      <ellipse cx="43" cy="154" rx="3.4" ry="9" transform="rotate(88 43 154)"/>
      <ellipse cx="49" cy="174" rx="3.4" ry="9" transform="rotate(100 49 174)"/>
    </g>

    <!-- ================= EMBLÈME CENTRAL ================= -->
    <g transform="translate(60 34)">
      <!-- cornes de zébu -->
      <path d="M53 39 C37 36 26 27 24 7 C28 22 38 29 54 32 Z"/>
      <path d="M67 39 C83 36 94 27 96 7 C92 22 82 29 66 32 Z"/>
      <!-- fer de lance et hampe -->
      <path d="M60 1 L64.5 14 C65.5 21 63.5 28 60 33 C56.5 28 54.5 21 55.5 14 Z"/>
      <rect x="58.2" y="31" width="3.6" height="77" rx="1.8"/>
      <!-- écu -->
      <path d="M34 42 H86 V74 C86 89 75 99.5 60 106 C45 99.5 34 89 34 74 Z" fill="none" stroke="#35302a" stroke-width="3.5"/>
      <!-- rameau (panneau gauche) -->
      <g fill="none" stroke="#35302a" stroke-width="2.2" stroke-linecap="round" opacity=".9">
        <path d="M47 50 V78"/>
        <path d="M47 60 Q40 57 39 50"/>
        <path d="M47 60 Q54 57 55 50"/>
        <path d="M47 70 Q40 67 39 60"/>
        <path d="M47 70 Q54 67 55 60"/>
      </g>
      <!-- tissage (panneau droit) -->
      <g fill="none" stroke="#35302a" stroke-width="2.2" opacity=".9">
        <path d="M73 48 L80 55 L73 62 L66 55 Z"/>
        <path d="M73 62 L80 69 L73 76 L66 69 Z"/>
      </g>
      <!-- frise de triangles (bas de l'écu) -->
      <path d="M42 90 L46 84.5 L50 90 Z M50 90 L54 84.5 L58 90 Z M62 90 L66 84.5 L70 90 Z M70 90 L74 84.5 L78 90 Z" opacity=".9"/>
    </g>

    <!-- ================= NOM ================= -->
    <text x="120" y="252" text-anchor="middle"
          font-family="Cinzel, 'Times New Roman', Georgia, serif"
          font-size="36" font-weight="700" letter-spacing="9"
          fill="#35302a">LEFONA</text>
  </g>
</svg>
